<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Dash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameWrapper">
  <canvas id="game" width="800" height="600"></canvas>

  <div id="hud" style="display:none;">
    <div class="hud-left">
      <div class="hud-stat">
        <div class="hud-label">SCORE</div>
        <div class="hud-value score" id="scoreDisplay">0</div>
      </div>
      <div class="hud-stat">
        <div class="hud-label">METERS</div>
        <div class="hud-value dist" id="distDisplay">0</div>
      </div>
      <div class="hud-stat">
        <div class="hud-label">COINS</div>
        <div class="hud-value coins" id="coinDisplay">0</div>
      </div>
    </div>
    <div class="hud-right">
      <div class="biome-chip" id="biomeChip">Jungle Temple</div>
      <button id="pauseBtn" class="pause-btn" type="button" aria-label="Pause">
        <span class="pause-icon" aria-hidden="true">
          <span class="bar"></span><span class="bar"></span>
        </span>
        <span class="play-icon" aria-hidden="true"></span>
      </button>
    </div>
    <div class="version" id="versionDisplay"></div>
  </div>

  <div id="pauseOverlay" class="pause-overlay">
    <div class="pause-card">
      <h2>PAUSED</h2>
      <div class="pause-hint">Press SPACE or tap below to resume</div>
      <button id="resumeBtn" type="button">RESUME</button>
    </div>
  </div>

  <div id="biomeBanner" class="biome-banner"></div>

  <div id="overlay">
    <h1>TEMPLE DASH</h1>
    <div class="subtitle">Run. Jump. Survive.</div>
    <div class="overlay-version-large" id="overlayVersionLarge"></div>
    <div class="score-display" id="finalScore" style="display:none;"></div>
    <div class="high-score" id="highScore" style="display:none;"></div>

    <div class="world-best" id="worldBest"></div>

    <button id="startBtn">RUN</button>

    <div class="leaderboard" id="leaderboardWrap">
      <div class="leaderboard-title">GLOBAL LEADERBOARD</div>
      <ol class="leaderboard-list" id="leaderboardList">
        <li class="leaderboard-empty">Loading top runners...</li>
      </ol>
    </div>

    <div class="controls-hint">
      &larr; &rarr; or A D &mdash; Switch Lanes<br>
      &uarr; or W &mdash; Jump<br>
      &darr; or S &mdash; Slide<br>
      SPACE &mdash; Pause
    </div>
    <div class="overlay-version" id="overlayVersion"></div>
  </div>
</div>

<!-- Load order matters: config first, biomes next (so drawers can read palettes), then modules, game.js last -->
<script src="src/config.js"></script>
<script src="src/biomes.js"></script>
<script>
  // Make canvas available to all modules
  TD.canvas = document.getElementById('game');
</script>
<script src="src/particles.js"></script>
<script src="src/player.js"></script>
<script src="src/obstacles.js"></script>
<script src="src/coins.js"></script>
<script src="src/environment.js"></script>
<script src="src/input.js"></script>
<script src="src/leaderboard.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>

</body>
</html>
