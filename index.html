<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Dash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameWrapper">
  <canvas id="game" width="800" height="600"></canvas>

  <div id="hud" style="display:none;">
    <div>
      <div class="score" id="scoreDisplay">0</div>
      <div class="dist" id="distDisplay">0m</div>
    </div>
    <div class="version" id="versionDisplay"></div>
  </div>

  <div id="overlay">
    <h1>TEMPLE DASH</h1>
    <div class="subtitle">Run. Jump. Survive.</div>
    <div class="score-display" id="finalScore" style="display:none;"></div>
    <div class="high-score" id="highScore" style="display:none;"></div>
    <button id="startBtn">RUN</button>
    <div class="controls-hint">
      ← → or A D — Switch Lanes<br>
      ↑ or W or SPACE — Jump
    </div>
  </div>
</div>

<!-- Load order matters: config first, then modules, game.js last -->
<script src="src/config.js"></script>
<script>
  // Make canvas available to all modules
  TD.canvas = document.getElementById('game');
</script>
<script src="src/particles.js"></script>
<script src="src/player.js"></script>
<script src="src/obstacles.js"></script>
<script src="src/coins.js"></script>
<script src="src/environment.js"></script>
<script src="src/input.js"></script>
<script src="src/ui.js"></script>
<script src="src/game.js"></script>

</body>
</html>
